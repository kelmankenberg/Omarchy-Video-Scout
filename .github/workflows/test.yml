name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run offline search regression tests
        run: python3 bin/test_search_videos.py
      - name: Run refresh settings regression tests
        run: python3 bin/test_refresh_settings.py
      - name: Run read state regression tests
        run: python3 bin/test_read_state.py
      - name: Run scroll read regression tests
        run: node bin/test_scroll_read.js
      - name: Check JSON files
        run: |
          python3 -m json.tool manifest.json > /dev/null
          python3 -m json.tool i18n/en.json > /dev/null
